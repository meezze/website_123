name: Verify fixed Daxi funnel
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JS syntax
        run: node --check app.js && node --check config.js && node --check i18n.js
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium
      - name: Start site
        run: |
          python3 -m http.server 4173 >/tmp/daxi-server.log 2>&1 &
          echo $! > /tmp/daxi-server.pid
          sleep 2
      - name: Verify mobile fixed flow
        run: |
          cat > verify.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});

          async function mobileLayout(width,height){
            const context=await browser.newContext({viewport:{width,height}});
            const page=await context.newPage();
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await page.evaluate(()=>localStorage.clear());
            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForSelector('#intro:not([hidden])');
            if(await page.locator('[data-intro-continue]').count()) throw new Error('Intro still has continue confirmation');
            await page.locator('[data-intro-skip]').click();
            await page.waitForSelector('.chooser-page');
            const layout=await page.evaluate(()=> {
              const intro=document.querySelector('.chooser-intro').getBoundingClientRect();
              const panel=document.querySelector('.chooser-panel').getBoundingClientRect();
              return {
                width:innerWidth,
                height:innerHeight,
                bodyClass:document.body.className,
                bodyScrollH:document.body.scrollHeight,
                bodyScrollW:document.documentElement.scrollWidth,
                homeHidden:document.querySelector('#home').hidden,
                flowPos:getComputedStyle(document.querySelector('#flow')).position,
                columns:getComputedStyle(document.querySelector('.chooser-page')).gridTemplateColumns,
                intro:{left:intro.left,right:intro.right,width:intro.width,top:intro.top,bottom:intro.bottom},
                panel:{left:panel.left,right:panel.right,width:panel.width,top:panel.top,bottom:panel.bottom}
              };
            });
            console.log('MOBILE',width,height,layout);
            if(!layout.bodyClass.includes('flow-lock')) throw new Error('body is not flow locked');
            if(!layout.homeHidden) throw new Error('landing home is visible');
            if(layout.bodyScrollH>layout.height+2) throw new Error('document scrolls vertically: '+JSON.stringify(layout));
            if(layout.bodyScrollW>layout.width+2) throw new Error('horizontal overflow: '+JSON.stringify(layout));
            if(layout.flowPos!=='fixed') throw new Error('#flow is not fixed');
            for(const [name,box] of Object.entries({intro:layout.intro,panel:layout.panel})){
              if(box.left < -1 || box.right > layout.width+1 || box.width > layout.width+2)
                throw new Error(name+' exceeds viewport: '+JSON.stringify(layout));
            }
            if(Math.abs(layout.intro.width-layout.width)>2 || Math.abs(layout.panel.width-layout.width)>2)
              throw new Error('chooser did not collapse to one column: '+JSON.stringify(layout));
            await context.close();
          }

          for(const [w,h] of [[360,800],[390,844],[430,932]]) await mobileLayout(w,h);

          const resetContext=await browser.newContext({viewport:{width:390,height:844}});
          const resetPage=await resetContext.newPage();
          await resetPage.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
          await resetPage.evaluate(()=>localStorage.clear());
          await resetPage.reload({waitUntil:'domcontentloaded'});
          await resetPage.waitForSelector('#intro:not([hidden])');
          await resetPage.locator('[data-intro-skip]').click();
          await resetPage.waitForSelector('.chooser-page');
          await resetPage.locator('[data-path="driver"]').click();
          await resetPage.waitForSelector('.quiz-page');
          await resetPage.locator('[data-answer="experience"]').first().click();
          await resetPage.waitForFunction(()=>document.querySelector('#question')?.dataset.step==='car');
          const beforeReload=await resetPage.evaluate(()=>({store:localStorage.getItem('daxi_site_state_v2'),lang:localStorage.getItem('daxi_lang')}));
          if(beforeReload.store!==null) throw new Error('test mode still persists answers');
          await resetPage.reload({waitUntil:'domcontentloaded'});
          await resetPage.waitForSelector('#intro:not([hidden])');
          await resetPage.locator('[data-intro-skip]').click();
          await resetPage.waitForSelector('.chooser-page');
          const resetState=await resetPage.evaluate(()=>({
            hasQuiz:!!document.querySelector('.quiz-page'),
            hasChooser:!!document.querySelector('.chooser-page'),
            path:new URL(location.href).searchParams.get('path'),
            store:localStorage.getItem('daxi_site_state_v2')
          }));
          console.log('RESET',resetState);
          if(!resetState.hasChooser || resetState.hasQuiz || resetState.store!==null) throw new Error('reload did not reset the questionnaire');
          await resetContext.close();

          const aboutContext=await browser.newContext({viewport:{width:390,height:844}});
          const aboutPage=await aboutContext.newPage();
          await aboutPage.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
          await aboutPage.evaluate(()=>localStorage.clear());
          await aboutPage.reload({waitUntil:'domcontentloaded'});
          await aboutPage.waitForSelector('#intro:not([hidden])');
          await aboutPage.locator('[data-intro-skip]').click();
          await aboutPage.waitForSelector('.chooser-page');
          await aboutPage.locator('.chooser-explore').click();
          await aboutPage.waitForSelector('#partners');
          const landing=await aboutPage.evaluate(()=>({
            flowLocked:document.body.classList.contains('flow-lock'),
            homeHidden:document.querySelector('#home').hidden,
            partners:!!document.querySelector('#partners'),
            company:!!document.querySelector('#company'),
            directions:!!document.querySelector('#directions'),
            app:!!document.querySelector('#app'),
            driverMap:!!document.querySelector('#driver-map'),
            community:!!document.querySelector('#community'),
            service:!!document.querySelector('#service'),
            appDetails:document.querySelectorAll('.app-detail-grid article').length,
            directionsCount:document.querySelectorAll('.direction-card').length,
            scrollH:document.body.scrollHeight,
            innerH:innerHeight
          }));
          console.log('LANDING',landing);
          if(landing.flowLocked) throw new Error('general landing remained flow-locked');
          if(landing.homeHidden || !landing.partners || !landing.company || !landing.directions || !landing.app || !landing.driverMap || !landing.community || !landing.service) throw new Error('general landing sections missing');
          if(landing.appDetails<6 || landing.directionsCount<6) throw new Error('general landing lost service/app detail cards');
          await aboutPage.locator('.landing-index [data-scroll="driver-map"]').click();
          await aboutPage.waitForFunction(()=>Math.abs(document.querySelector('#driver-map').getBoundingClientRect().top)<180);
          await aboutPage.locator('[data-map-cat="coffee"]').click();
          const mapState=await aboutPage.evaluate(()=>({
            active:document.querySelector('[data-map-cat="coffee"]').classList.contains('active'),
            coffeeMuted:document.querySelector('[data-map-point="coffee"]').classList.contains('muted'),
            restMuted:document.querySelector('[data-map-point="rest"]').classList.contains('muted')
          }));
          console.log('MAP',mapState);
          if(!mapState.active || mapState.coffeeMuted || !mapState.restMuted) throw new Error('driver map filtering is broken');
          if(landing.scrollH<=landing.innerH) throw new Error('general landing is not browseable');
          await aboutPage.locator('[data-resume-flow]').first().click();
          await aboutPage.waitForSelector('.chooser-page');
          const resumed=await aboutPage.evaluate(()=>({
            flowLocked:document.body.classList.contains('flow-lock'),
            scrollH:document.body.scrollHeight,
            innerH:innerHeight,
            scrollW:document.documentElement.scrollWidth,
            innerW:innerWidth
          }));
          if(!resumed.flowLocked || resumed.scrollH>resumed.innerH+2 || resumed.scrollW>resumed.innerW+2) throw new Error('funnel did not resume cleanly: '+JSON.stringify(resumed));
          await aboutContext.close();

          const context=await browser.newContext({viewport:{width:360,height:800}});
          const page=await context.newPage();
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
          await page.evaluate(()=>localStorage.clear());
          await page.reload({waitUntil:'domcontentloaded'});
          await page.waitForSelector('#intro:not([hidden])');
          await page.locator('[data-intro-skip]').click();
          await page.waitForSelector('.chooser-page');
          const exploreVisible=await page.locator('.chooser-explore').isVisible();
          const headerAboutVisible=await page.locator('.flow-about-link').isVisible();
          if(!exploreVisible || !headerAboutVisible) throw new Error('Daxi explore entry is not visible in funnel');
          await page.locator('[data-path="driver"]').click();
          await page.waitForSelector('.quiz-page');
          let metrics=await page.evaluate(()=>({w:innerWidth,scrollW:document.documentElement.scrollWidth,scrollH:document.body.scrollHeight,h:innerHeight}));
          if(metrics.scrollW>metrics.w+2 || metrics.scrollH>metrics.h+2) throw new Error('driver quiz overflows viewport: '+JSON.stringify(metrics));
          await page.locator('[data-answer="experience"]').first().click();
          await page.waitForFunction(()=>document.querySelector('#question')?.dataset.step==='car');
          await page.locator('[data-picker="brand"] .picker-button').click();
          await page.locator('[data-picker="brand"] [data-pick="Toyota"]').click();
          await page.locator('[data-picker="model"] .picker-button').click();
          await page.locator('[data-picker="model"] [data-pick="Prius 30"]').click();
          await page.locator('[data-picker="year"] .picker-button').click();
          await page.locator('[data-picker="year"] [data-pick="2020"]').click();
          await page.waitForFunction(()=>document.querySelector('#question')?.dataset.step==='schedule');
          await page.locator('[data-next]').click();
          await page.waitForFunction(()=>document.querySelector('#question')?.dataset.step==='driving');
          await page.locator('[data-answer="driving"][data-value="3-5"]').click();
          await page.waitForSelector('.result');
          const result=await page.evaluate(()=>({
            bodyScroll:document.body.scrollHeight,
            docScrollW:document.documentElement.scrollWidth,
            innerH:innerHeight,
            innerW:innerWidth,
            resultOverflow:getComputedStyle(document.querySelector('.result')).overflowY
          }));
          console.log('RESULT',result);
          if(result.bodyScroll>result.innerH+2) throw new Error('body scroll returned on result');
          if(result.docScrollW>result.innerW+2) throw new Error('result has horizontal overflow');
          await context.close();

          for(const p of ['driver','car','owner','business']){
            const ctx=await browser.newContext({viewport:{width:390,height:844}});
            const pg=await ctx.newPage();
            await pg.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await pg.evaluate(()=>localStorage.clear());
            await pg.reload({waitUntil:'domcontentloaded'});
            await pg.waitForSelector('#intro:not([hidden])');
            await pg.locator('[data-intro-skip]').click();
            await pg.waitForSelector('.chooser-page');
            await pg.locator('[data-path="'+p+'"]').click();
            await pg.waitForSelector('.quiz-page');
            const step=await pg.locator('#question').getAttribute('data-step');
            const x=await pg.evaluate(()=>({w:innerWidth,scrollW:document.documentElement.scrollWidth}));
            if(x.scrollW>x.w+2) throw new Error(p+' path has horizontal overflow');
            console.log('PATH',p,'STEP',step);
            await ctx.close();
          }
          await browser.close();
          JS
          node verify.mjs
